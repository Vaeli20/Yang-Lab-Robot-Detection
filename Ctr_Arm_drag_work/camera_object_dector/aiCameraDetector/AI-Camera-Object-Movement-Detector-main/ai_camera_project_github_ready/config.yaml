# Detection and motion configuration
# normal version (Fastest) -- Simple but less accurate
model: yolov8n.pt
conf_threshold: 0.30
iou_threshold: 0.45
imgsz: 416
frame_scale: 0.80
motion_history: 5
motion_area_threshold: 500
contrast_alpha: 1.10
brightness_beta: -10
saturation_scale: 1.20

